name: museum-assistant

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-museum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-museum_dev}
      POSTGRES_DB: ${POSTGRES_DB:-museum}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: ./backend
    image: museum-assistant-api:local
    environment: &backend-environment
      # URL.create builds the URL in Python to safely handle punctuation in passwords.
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-museum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-museum_dev}
      POSTGRES_DB: ${POSTGRES_DB:-museum}
      DATASET_DIR: /data/Dataset
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    image: museum-assistant-api:local
    environment: *backend-environment
    volumes:
      - ./Dataset:/data/Dataset:ro
    ports:
      - "${API_PORT:-8002}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
